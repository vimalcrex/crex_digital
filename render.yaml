# CREX Digital - Render Blueprint
# https://render.com/docs/blueprint-spec

services:
  # Main Next.js Web Service
  - type: web
    name: crex-web
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: crex-redis
          type: redis
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SETUP_FEE_PRICE_ID
        sync: false
      - key: STRIPE_MONTHLY_PRICE_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
    autoDeploy: true

  # Background Worker for async jobs
  - type: worker
    name: crex-worker
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: crex-redis
          type: redis
          property: connectionString
    autoDeploy: true

  # Redis for caching and job queues
  - type: redis
    name: crex-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru

databases:
  # PostgreSQL Database
  - name: crex-db
    region: oregon
    plan: starter
    databaseName: crex_digital
    user: crex_admin
    ipAllowList: []
